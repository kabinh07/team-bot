  web:
    build: .
    container_name: kanbann_web
    command: >
      sh -c "python migrate.py && python seed.py &&
             uvicorn api:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=${WEB_DATABASE_URL:-postgresql://kanbann:kanbann@db:5432/kanbann}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SEED_DEMO=${SEED_DEMO:-false}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./:/app
    # depends_on:
    #   db:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: always

